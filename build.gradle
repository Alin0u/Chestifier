plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
    }

    mods {
        chestifier {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

def jarName = "${project.archives_base_name}-${project.minecraft_version}_v${project.mod_version}-neoforge"

jar {
    archiveFileName = "${jarName}.jar"
}

tasks.named('sourcesJar') {
    archiveFileName = "${jarName}-sources.jar"
}
